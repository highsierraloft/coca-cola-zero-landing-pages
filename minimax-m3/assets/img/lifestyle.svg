<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Coca-Cola Zero lifestyle">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a0306"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2a0608" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect y="280" width="600" height="120" fill="url(#floor)"/>
  <ellipse cx="300" cy="320" rx="120" ry="14" fill="#E61A27" opacity="0.25"/>
  <g transform="translate(220 60)">
    <rect x="0" y="20" width="160" height="220" rx="14" fill="#0a0a0a" stroke="#000" stroke-width="3"/>
    <rect x="14" y="50" width="132" height="120" fill="#E61A27"/>
    <text x="80" y="115" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="40" fill="#fff" font-style="italic">Coca</text>
    <text x="80" y="155" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="40" fill="#fff" font-style="italic">Cola</text>
    <text x="80" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="32" fill="#fff" letter-spacing="3">ZERO</text>
  </g>
  <circle cx="120" cy="90" r="4" fill="#ff8090" opacity="0.7"/>
  <circle cx="500" cy="60" r="3" fill="#ff8090" opacity="0.5"/>
  <circle cx="540" cy="180" r="5" fill="#ff8090" opacity="0.6"/>
</svg>
