<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <!-- Can Body Gradients -->
    <linearGradient id="canBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="12%" stop-color="#181818" />
      <stop offset="28%" stop-color="#383838" />
      <stop offset="42%" stop-color="#202020" />
      <stop offset="70%" stop-color="#0a0a0a" />
      <stop offset="90%" stop-color="#282828" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <!-- Metallic Top Rim Gradient -->
    <linearGradient id="metalRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#555" />
      <stop offset="20%" stop-color="#bbb" />
      <stop offset="35%" stop-color="#fff" />
      <stop offset="55%" stop-color="#888" />
      <stop offset="85%" stop-color="#ddd" />
      <stop offset="100%" stop-color="#333" />
    </linearGradient>

    <!-- Metallic Chime/Lip Gradient -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222" />
      <stop offset="25%" stop-color="#888" />
      <stop offset="50%" stop-color="#e0e0e0" />
      <stop offset="75%" stop-color="#666" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>

    <!-- Red Banner Gradient -->
    <linearGradient id="cokeRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800005" />
      <stop offset="25%" stop-color="#e0000a" />
      <stop offset="45%" stop-color="#ff1a24" />
      <stop offset="75%" stop-color="#d40008" />
      <stop offset="100%" stop-color="#700004" />
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="canShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#f40009" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="15" stdDeviation="35" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#canShadow)">
    <!-- Can Top Rim / Neck Bevel -->
    <path d="M 120 70 Q 200 60 280 70 L 290 95 Q 200 85 110 95 Z" fill="url(#metalRimGrad)" />

    <!-- Can Top Lid Oval -->
    <ellipse cx="200" cy="70" rx="80" ry="18" fill="url(#metalRimGrad)" stroke="#444" stroke-width="1.5" />
    <ellipse cx="200" cy="69" rx="68" ry="14" fill="#666" opacity="0.6" />
    <!-- Stay-on tab -->
    <path d="M 188 64 Q 200 60 212 64 L 210 73 Q 200 75 190 73 Z" fill="#ccc" stroke="#777" stroke-width="1" />
    <circle cx="200" cy="67" r="3" fill="#444" />
    <ellipse cx="196" cy="64" rx="4" ry="2" fill="#222" />

    <!-- Upper Taper / Chime -->
    <path d="M 110 95 Q 200 85 290 95 L 305 135 Q 200 125 95 135 Z" fill="url(#lipGrad)" />
    
    <!-- Main Can Body -->
    <path d="M 95 135 Q 200 125 305 135 L 305 570 Q 200 580 95 570 Z" fill="url(#canBodyGrad)" />

    <!-- Red Top Brand Accent Banner -->
    <path d="M 95 135 Q 200 125 305 135 L 305 210 Q 200 200 95 210 Z" fill="url(#cokeRedGrad)" />
    
    <!-- Coca-Cola Brand Ribbon / Wave in Red Zone -->
    <path d="M 95 185 Q 160 165 200 195 T 305 180 L 305 210 Q 200 200 95 210 Z" fill="#ffffff" opacity="0.15" />

    <!-- Red Brand Accent Disc / Badge -->
    <circle cx="200" cy="185" r="28" fill="url(#cokeRedGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glowEffect)" />
    <text x="200" y="190" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ORIGINAL</text>

    <!-- "Coca-Cola" Flowing Logo Representation (Vertical Orientation like sleek cans) -->
    <g transform="translate(180, 355) rotate(-90)">
      <!-- Main Script Typography -->
      <text x="0" y="0" font-family="'Brush Script MT', 'Bickham Script Pro', 'Segoe Script', cursive, sans-serif" font-size="58" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        Coca-Cola
      </text>
      <!-- Dynamic Dynamic Contour Underline -->
      <path d="M -125 14 Q -40 28 35 12 Q 95 -1 130 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- "zero sugar" Badge & Typography -->
    <g transform="translate(200, 470)">
      <rect x="-82" y="-18" width="164" height="36" rx="18" fill="#f40009" />
      <text x="0" y="6" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">
        ZERO SUGAR
      </text>
    </g>

    <!-- Subtle Feature Badges on Can -->
    <text x="200" y="525" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#a0a0a0" text-anchor="middle" letter-spacing="3">
      REAL MAGIC • 330 mL
    </text>

    <!-- Metallic Lower Taper -->
    <path d="M 95 570 Q 200 580 305 570 L 290 620 Q 200 630 110 620 Z" fill="url(#lipGrad)" />

    <!-- Bottom Aluminum Rim Base -->
    <ellipse cx="200" cy="620" rx="90" ry="14" fill="url(#metalRimGrad)" />
    <ellipse cx="200" cy="622" rx="80" ry="10" fill="#111" opacity="0.8" />

    <!-- Glossy Specular Cylinder Reflection Across Can -->
    <path d="M 95 135 L 305 135 L 305 570 L 95 570 Z" fill="url(#specularGlow)" pointer-events="none" />

    <!-- Condensation Droplets -->
    <!-- Droplet 1 -->
    <ellipse cx="140" cy="240" rx="4" ry="6" fill="#ffffff" opacity="0.6" />
    <circle cx="139" cy="238" r="1.5" fill="#ffffff" />
    <!-- Droplet 2 -->
    <ellipse cx="145" cy="310" rx="3" ry="5" fill="#ffffff" opacity="0.5" />
    <!-- Droplet 3 -->
    <ellipse cx="260" cy="290" rx="5" ry="7" fill="#ffffff" opacity="0.7" />
    <circle cx="258" cy="288" r="2" fill="#ffffff" />
    <!-- Droplet 4 -->
    <ellipse cx="270" cy="420" rx="4" ry="6" fill="#ffffff" opacity="0.6" />
    <!-- Droplet 5 -->
    <ellipse cx="130" cy="440" rx="5" ry="8" fill="#ffffff" opacity="0.5" />
    <!-- Droplet 6 (Dripping trail) -->
    <path d="M 165 340 Q 166 360 167 375" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none" />
    <circle cx="167" cy="377" r="3" fill="#ffffff" opacity="0.7" />
    <!-- Droplet 7 -->
    <ellipse cx="240" cy="510" rx="4" ry="5" fill="#ffffff" opacity="0.6" />
    <!-- Droplet 8 -->
    <ellipse cx="170" cy="210" rx="3" ry="4" fill="#ffffff" opacity="0.7" />
  </g>
</svg>
